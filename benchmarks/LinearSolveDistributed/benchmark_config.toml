# Runner configuration for the distributed (CPU / MPI) linear-solver benchmarks.
#
# CPU MPI scaling runs — stable multi-core self-hosted hardware (amdci1/amdci3).
# The GPU benchmark (B7) lives in the sibling folder LinearSolveDistributedGPU/
# with its own ["self-hosted","gpu","exclusive"] runner, because runner selection
# is resolved per benchmark folder.
runner = ["self-hosted", "benchmark"]
timeout = 12000
